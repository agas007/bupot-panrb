version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bupot_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: bupot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bupot_user
      POSTGRES_PASSWORD: bupot_password
      POSTGRES_DB: bupot_db
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bupot_user -d bupot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
