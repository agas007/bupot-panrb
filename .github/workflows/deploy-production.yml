name: Deploy Bupot Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bupot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, bupot-production]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Deploy application
        shell: bash
        run: |
          set -Eeuo pipefail

          cd /opt/bupot
          git fetch --prune origin main
          git pull --ff-only origin main
          chmod +x scripts/deploy-production.sh
          scripts/deploy-production.sh "${GITHUB_SHA}"
